name: "Ruby on Rails CI"
on:
  push:
    branches: [ "*" ]
  # Allows re-running the suite from the Actions tab without pushing a commit,
  # which is useful when a run fails for infrastructure reasons rather than
  # code ones.
  workflow_dispatch:
    inputs:
      system_test_seed:
        description: Optional numeric seed to reproduce a browser test order
        required: false
        type: string
jobs:
  build_and_run_tests:
    name: Build and run tests
    runs-on: ubuntu-latest
    env:
      ETD_SYSTEM_TEST_SEED: ${{ inputs.system_test_seed }}
      ETD_SYSTEM_TEST_PORT: 3425
      GRADUATE_EMAIL_STRICT_REPORT: 1
    # The suite runs in roughly 5 minutes per database backend. Without a
    # timeout a hung job sits on the default 6 hour limit and surfaces as
    # "the hosted runner lost communication with the server" instead of a
    # readable failure.
    timeout-minutes: 30
    services:
      mysql:
        image: mysql
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: etd_graduate_email_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        # Set health checks to wait until mysql has started
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Select installed Chrome
        run: |
          browser_bin="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)"
          test -x "$browser_bin"
          echo "CHROME_BIN=$browser_bin" >> "$GITHUB_ENV"

      - name: Run tests with sqlite3
        run: |
          bash script/verify_graduate_email sqlite
          bash script/verify_graduate_email_storage sqlite exec ruby test/support/graduate_email_task5_test_reporter.rb -v
          bash script/verify_graduate_email_storage sqlite exec ruby test/support/graduate_email_task5_test_reporter.rb test/system -v --seed="${ETD_SYSTEM_TEST_SEED:-27183}"

      - name: Run tests with mysql
        env:
          GRADUATE_EMAIL_TEST_DATABASE_URL: mysql2://test:test@127.0.0.1:3306/etd_graduate_email_test
          GRADUATE_EMAIL_TEST_DATABASE_CONFIRMED: dedicated_disposable_test
        run: |
          bash script/verify_graduate_email mysql
          bash script/verify_graduate_email_storage mysql exec ruby test/support/graduate_email_task5_test_reporter.rb -v
          bash script/verify_graduate_email_storage mysql exec ruby test/support/graduate_email_task5_test_reporter.rb test/system -v --seed="${ETD_SYSTEM_TEST_SEED:-27183}"

      - name: Scan graduate email allowlisted artifacts
        id: graduate_email_scan
        if: always()
        run: |
          found=0
          for adapter in sqlite mysql; do
            if [ -d "tmp/graduate-email/verification/$adapter" ]; then
              bash script/verify_graduate_email "$adapter" scan
              found=1
            fi
          done
          test "$found" = 1

      - name: Upload clean graduate email evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.graduate_email_scan.outcome == 'success'
        with:
          name: graduate-email-verification
          path: |
            tmp/graduate-email/verification/sqlite/*.txt
            tmp/graduate-email/verification/sqlite/*.json
            tmp/graduate-email/verification/sqlite/*.png
            tmp/graduate-email/verification/mysql/*.txt
            tmp/graduate-email/verification/mysql/*.json
            tmp/graduate-email/verification/mysql/*.png

      - name: Create tar archive of screenshots
        run: |
          ( cd /home/runner/work/etd/etd/tmp && [ -d ./test-screenshots ] && tar cvf test-screenshots.tar ./test-screenshots ) || true
        if: always()

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: |
            tmp/test-screenshots.tar
