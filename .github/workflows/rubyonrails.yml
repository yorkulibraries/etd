name: "Ruby on Rails CI"
on:
  push:
    branches: [ "*" ]
  # Allows re-running the suite from the Actions tab without pushing a commit,
  # which is useful when a run fails for infrastructure reasons rather than
  # code ones.
  workflow_dispatch:
    inputs:
      system_test_seed:
        description: Optional numeric seed to reproduce a browser test order
        required: false
        type: string
jobs:
  database_tests:
    name: Tests (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        adapter: [sqlite, mysql]
    env:
      GRADUATE_EMAIL_CI_ADAPTER: ${{ matrix.adapter }}
      GRADUATE_EMAIL_TEST_DATABASE_URL: ${{ matrix.adapter == 'mysql' && 'mysql2://test:test@127.0.0.1:3306/etd_graduate_email_test' || '' }}
      GRADUATE_EMAIL_TEST_DATABASE_CONFIRMED: ${{ matrix.adapter == 'mysql' && 'dedicated_disposable_test' || '' }}
      ETD_SYSTEM_TEST_SEED: ${{ inputs.system_test_seed }}
      ETD_SYSTEM_TEST_PORT: 3425
      GRADUATE_EMAIL_STRICT_REPORT: 1
    # Each database gets its own runner and time budget; tests within it
    # remain sequential because they share a disposable database.
    timeout-minutes: 30
    services:
      mysql:
        image: ${{ matrix.adapter == 'mysql' && 'mysql' || '' }}
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: etd_graduate_email_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        # Set health checks to wait until mysql has started
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Select installed Chrome
        run: |
          browser_bin="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)"
          test -x "$browser_bin"
          echo "CHROME_BIN=$browser_bin" >> "$GITHUB_ENV"

      - name: Run graduate email verification
        run: bash script/verify_graduate_email "$GRADUATE_EMAIL_CI_ADAPTER"

      - name: Run full application suite
        run: bash script/verify_graduate_email_storage "$GRADUATE_EMAIL_CI_ADAPTER" exec ruby test/support/graduate_email_task5_test_reporter.rb -v

      - name: Run full browser suite
        run: bash script/verify_graduate_email_storage "$GRADUATE_EMAIL_CI_ADAPTER" exec ruby test/support/graduate_email_task5_test_reporter.rb test/system -v --seed="${ETD_SYSTEM_TEST_SEED:-27183}"

      - name: Scan graduate email allowlisted artifacts
        id: graduate_email_scan
        if: always()
        run: bash script/verify_graduate_email "$GRADUATE_EMAIL_CI_ADAPTER" scan

      - name: Upload clean graduate email evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.graduate_email_scan.outcome == 'success'
        with:
          name: graduate-email-verification-${{ matrix.adapter }}
          path: |
            tmp/graduate-email/verification/${{ matrix.adapter }}/*.txt
            tmp/graduate-email/verification/${{ matrix.adapter }}/*.json
            tmp/graduate-email/verification/${{ matrix.adapter }}/*.png

      - name: Create tar archive of screenshots
        run: |
          ( cd /home/runner/work/etd/etd/tmp && [ -d ./test-screenshots ] && tar cvf test-screenshots.tar ./test-screenshots ) || true
        if: always()

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots-${{ matrix.adapter }}
          path: |
            tmp/test-screenshots.tar

  build_and_run_tests:
    name: Build and run tests
    needs: database_tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_TEST_RESULT: ${{ needs.database_tests.result }}
    steps:
      - name: Require both database jobs to pass
        run: test "$DATABASE_TEST_RESULT" = success
